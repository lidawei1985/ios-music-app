# 大伟歌 · iOS 版 · 免签裸包流水线（公开中转）
#
# 为什么用云端 macOS：本机是 Windows，没有 Xcode，无法本地出 .app/.ipa。
# 这条流水线在 macos runner 上用 XcodeGen 生成工程 → xcodebuild 出**未签名**的真机包，
# 产物交给爱思助手（Apple ID 免费签名）或 LiveContainer 侧载安装。
#
# 与内核的关系：内核唯一真源 = kernel/app.html（由本机 prototype/app.html 同步而来）。
# 每次构建都现场跑 scripts/pack.py 打 data-shell="ios" 壳标记 —— 不在仓库里存伪物，避免漂移。
name: build-ipa

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: 准备 xcodegen（预装优先 → brew → 官方包兜底）
        run: |
          set -euo pipefail
          if command -v xcodegen >/dev/null 2>&1; then xcodegen --version; exit 0; fi
          export HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1
          if brew install xcodegen; then xcodegen --version; exit 0; fi
          echo "brew 失败 → 官方预编译包兜底"
          curl -fL --retry 3 -o /tmp/xcodegen.zip \
            https://github.com/yonaskolb/XcodeGen/releases/latest/download/xcodegen.zip
          unzip -q /tmp/xcodegen.zip -d /tmp/xg
          sudo cp /tmp/xg/xcodegen/bin/xcodegen /usr/local/bin/xcodegen
          sudo chmod +x /usr/local/bin/xcodegen
          xcodegen --version

      - name: 打壳（内核 → Resources/app.html，data-shell=ios）
        run: python3 scripts/pack.py

      - name: 生成 Xcode 工程
        run: xcodegen generate

      - name: 出真机裸包（unsigned）
        run: |
          set -euo pipefail
          set -o pipefail
          if ! xcodebuild -project DWGMusic.xcodeproj \
              -scheme DWGMusic \
              -configuration Release \
              -destination 'generic/platform=iOS' \
              -derivedDataPath build/DD \
              CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY= \
              build 2>&1 | tee /tmp/build.log | tail -30; then
            echo "===== 编译失败，错误行如下 ====="
            grep -E "error:" /tmp/build.log | sort -u | head -60 || true
            exit 1
          fi

          # 产物名跟随 CFBundleDisplayName（中文「大伟歌.app」），因此按 *.app 找，且必须在
          # Release-iphoneos 根下（maxdepth 1），避免匹配到 .dSYM 或 Frameworks 里的嵌套包。
          app=$(find build/DD/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -type d | head -1)
          [ -n "$app" ] || { echo "::error::真机 .app 未产出"; ls -la build/DD/Build/Products/Release-iphoneos || true; exit 1; }
          echo "app = $app"

          # 硬门禁：内核必须真进 bundle，且必须带 iOS 壳标记（防「编出来是空壳」）
          k="$app/app.html"
          [ -f "$k" ] || { echo "::error::app.html 未打进 App bundle"; exit 1; }
          ks=$(stat -f%z "$k")
          echo "kernel in bundle: $ks bytes"
          [ "$ks" -gt 2000000 ] || { echo "::error::内核仅 $ks 字节，疑似被裁剪"; exit 1; }
          grep -q 'data-shell="ios"' "$k" || { echo "::error::内核缺 data-shell=\"ios\" 壳标记"; exit 1; }
          grep -q '__PLATFORM__' "$k" || { echo "::error::内核缺平台标识注入"; exit 1; }

          # 硬门禁：曲库分块必须真进 bundle（离线 13 万首搜索的根基）
          cn=$(ls "$app" | grep -c '^cat-.*\.js$' || true)
          echo "catalog chunks in bundle: $cn"
          [ -f "$app/cat-manifest.js" ] || { echo "::error::cat-manifest.js 未进 bundle（曲库分块缺失）"; exit 1; }
          [ "$cn" -ge 5 ] || { echo "::error::曲库分块只有 $cn 个（应 ≥5：1 清单 + 1 索引 + 3 分片）"; exit 1; }

          mkdir -p out/Payload
          cp -R "$app" out/Payload/
          (cd out && zip -qry DWGMusic-unsigned.ipa Payload)
          ls -la out

      - name: 上传裸包
        uses: actions/upload-artifact@v4
        with:
          name: DWGMusic-unsigned-ipa
          path: out/DWGMusic-unsigned.ipa
          retention-days: 7

      # ── 内核热更新清单 ────────────────────────────────────────────────
      # App 端启动时去 kernel.json 比对版本，比本地新就静默下载 app.html 覆盖沙盒内核
      # —— 于是「改内核」不必再重新出包推机。
      #
      # 关键：下发给 App 的必须是**注入壳标记后**的内核（Resources/app.html，data-shell=ios），
      # 而不是仓库里的 kernel/app.html 源码（它没壳标记，App 侧的安全校验会拒收）。
      # 所以这里把 pack.py 的产出复制成 kernel/dist.html 再发。
      # 版本号取内容 sha256 前 12 位：内容一变版本必变，杜绝「改了内容忘了改版本号」。
      - name: 发布内核热更新清单
        if: github.ref == 'refs/heads/main'
        # 注意：shell 里 $VAR 后面**绝对不要紧跟中文/全角字符**。
        # bash 解析变量名时会把多字节首字节吞进名字，set -u 下直接
        # 报 "VER?: unbound variable"（早期版本就踩了这个坑）。
        # 因此下面一律写成 ${VAR} 显式定界，且用 printf 拼 JSON。
        run: |
          set -euo pipefail
          # 复用上一步「打壳」的产出（已含 data-shell=ios + __PLATFORM__）
          python3 scripts/pack.py
          SRC=Resources/app.html
          [ -f "${SRC}" ] || { echo "::error::${SRC} missing"; exit 1; }
          cp "${SRC}" kernel/dist.html
          BYTES=$(stat -f%z kernel/dist.html)
          SHA=$(shasum -a 256 kernel/dist.html | awk '{print $1}')
          VER=${SHA:0:12}
          NOW=$(date -u '+%Y-%m-%dT%H:%M:%SZ')

          printf '{\n  "version": "%s",\n  "file": "dist.html",\n  "bytes": %s,\n  "sha256": "%s",\n  "updated": "%s"\n}\n' \
            "${VER}" "${BYTES}" "${SHA}" "${NOW}" > kernel/kernel.json

          echo "kernel.json -> v${VER} (${BYTES} bytes, kernel/dist.html)"
          cat kernel/kernel.json

          git config user.name "dwg-kernel-bot"
          git config user.email "dwg-kernel-bot@users.noreply.github.com"
          git add kernel/dist.html kernel/kernel.json
          if git diff --cached --quiet; then
            echo "kernel unchanged, skip commit"
          else
            git commit -m "kernel hot-update v${VER} (${BYTES} bytes) ${NOW}"
            git push
            echo "pushed kernel v${VER}"
          fi

      - name: 刷新 CDN 缓存（让新版立刻可拉）
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        run: |
          for f in kernel/dist.html kernel/kernel.json; do
            curl -sS --max-time 30 \
              "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@main/$f" -o /dev/null \
              && echo "purged: $f" || echo "purge skipped: $f"
          done
