# 大伟歌 · iOS 版 · 免签裸包流水线（公开中转）
#
# 为什么用云端 macOS：本机是 Windows，没有 Xcode，无法本地出 .app/.ipa。
# 这条流水线在 macos runner 上用 XcodeGen 生成工程 → xcodebuild 出**未签名**的真机包，
# 产物交给爱思助手（Apple ID 免费签名）或 LiveContainer 侧载安装。
#
# 与内核的关系：内核唯一真源 = kernel/app.html（由本机 prototype/app.html 同步而来）。
# 每次构建都现场跑 scripts/pack.py 打 data-shell="ios" 壳标记 —— 不在仓库里存伪物，避免漂移。
name: build-ipa

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  # 需要 write：内核热更步骤要把 kernel/dist.html + kernel/kernel.json 推回本仓库，
  # 手机端下次冷启动才能从 CDN 拉到新版（否则 github-actions[bot] 403）。
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      # ★ 用 deploy key 检出（保留 ssh-key 写法，成本为零；ssh-key 为空会自动回落 https）。
      #   ★★ 注意：早前「真凭据推送 → 触发 jsDelivr webhook → 秒级生效」这个假设**已被反证**。
      #     反证实验（2026-10-06）：cloud 仓改用 deploy key 推后，`data/probe.json`
      #     （**全新文件名**）7 秒即取到 ✅，但同一次提交里的 `data/assets/cv.json`
      #     （**老 URL**）纹丝不动 → 根本不是凭据问题。
      #     真相：jsDelivr **按 URL 缓存** —— 新 URL（新文件名/新 sha/新 tag）立即回源，
      #     老 URL（@main / @latest）一律吃硬缓存（分支 12 小时、别名 7 天），
      #     purge 与 ?t= 都击不穿（实测判决表见 kernel 的 KUP 注释）。
      #   → 所以「内核推送后立刻生效」靠的是下面的**时效锚点**（kernel/win/<窗口>.js），
      #     不是 deploy key，也不是 purge。deploy key 只解决「checkout 能走 SSH」。
      - uses: actions/checkout@v4
        with:
          ssh-key: ${{ secrets.IOS_DEPLOY_KEY }}

      - name: 准备 xcodegen（预装优先 → brew → 官方包兜底）
        run: |
          set -euo pipefail
          if command -v xcodegen >/dev/null 2>&1; then xcodegen --version; exit 0; fi
          export HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1
          if brew install xcodegen; then xcodegen --version; exit 0; fi
          echo "brew 失败 → 官方预编译包兜底"
          curl -fL --retry 3 -o /tmp/xcodegen.zip \
            https://github.com/yonaskolb/XcodeGen/releases/latest/download/xcodegen.zip
          unzip -q /tmp/xcodegen.zip -d /tmp/xg
          sudo cp /tmp/xg/xcodegen/bin/xcodegen /usr/local/bin/xcodegen
          sudo chmod +x /usr/local/bin/xcodegen
          xcodegen --version

      - name: 打壳（内核 → Resources/app.html，data-shell=ios）
        run: python3 scripts/pack.py

      - name: 生成 Xcode 工程
        run: xcodegen generate

      - name: 出真机裸包（unsigned）
        run: |
          set -euo pipefail
          set -o pipefail
          if ! xcodebuild -project DWGMusic.xcodeproj \
              -scheme DWGMusic \
              -configuration Release \
              -destination 'generic/platform=iOS' \
              -derivedDataPath build/DD \
              CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY= \
              build 2>&1 | tee /tmp/build.log | tail -30; then
            echo "===== 编译失败，错误行如下 ====="
            grep -E "error:" /tmp/build.log | sort -u | head -60 || true
            exit 1
          fi

          # 产物名跟随 CFBundleDisplayName（中文「大伟歌.app」），因此按 *.app 找，且必须在
          # Release-iphoneos 根下（maxdepth 1），避免匹配到 .dSYM 或 Frameworks 里的嵌套包。
          app=$(find build/DD/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -type d | head -1)
          [ -n "$app" ] || { echo "::error::真机 .app 未产出"; ls -la build/DD/Build/Products/Release-iphoneos || true; exit 1; }
          echo "app = $app"

          # 硬门禁：内核必须真进 bundle，且必须带 iOS 壳标记（防「编出来是空壳」）
          k="$app/app.html"
          [ -f "$k" ] || { echo "::error::app.html 未打进 App bundle"; exit 1; }
          ks=$(stat -f%z "$k")
          echo "kernel in bundle: $ks bytes"
          [ "$ks" -gt 2000000 ] || { echo "::error::内核仅 $ks 字节，疑似被裁剪"; exit 1; }
          grep -q 'data-shell="ios"' "$k" || { echo "::error::内核缺 data-shell=\"ios\" 壳标记"; exit 1; }
          grep -q '__PLATFORM__' "$k" || { echo "::error::内核缺平台标识注入"; exit 1; }

          # 硬门禁：曲库分块必须真进 bundle（离线 13 万首搜索的根基）
          cn=$(ls "$app" | grep -c '^cat-.*\.js$' || true)
          echo "catalog chunks in bundle: $cn"
          [ -f "$app/cat-manifest.js" ] || { echo "::error::cat-manifest.js 未进 bundle（曲库分块缺失）"; exit 1; }
          [ "$cn" -ge 5 ] || { echo "::error::曲库分块只有 $cn 个（应 ≥5：1 清单 + 1 索引 + 3 分片）"; exit 1; }

          mkdir -p out/Payload
          cp -R "$app" out/Payload/
          (cd out && zip -qry DWGMusic-unsigned.ipa Payload)
          ls -la out

      - name: 上传裸包
        uses: actions/upload-artifact@v4
        with:
          name: DWGMusic-unsigned-ipa
          path: out/DWGMusic-unsigned.ipa
          retention-days: 7

      # ── 内核热更新清单 ────────────────────────────────────────────────
      # App 端启动时去 kernel.json 比对版本，比本地新就静默下载 app.html 覆盖沙盒内核
      # —— 于是「改内核」不必再重新出包推机。
      #
      # 关键：下发给 App 的必须是**注入壳标记后**的内核（Resources/app.html，data-shell=ios），
      # 而不是仓库里的 kernel/app.html 源码（它没壳标记，App 侧的安全校验会拒收）。
      # 所以这里把 pack.py 的产出复制成 kernel/dist.html 再发。
      # 版本号取内容 sha256 前 12 位：内容一变版本必变，杜绝「改了内容忘了改版本号」。
      - name: 发布内核热更新清单
        if: github.ref == 'refs/heads/main'
        env:
          # 建 release 需要 token（contents: write 已声明）。gh CLI 在 macos runner 上预装。
          GH_TOKEN: ${{ github.token }}
        # 注意：shell 里 $VAR 后面**绝对不要紧跟中文/全角字符**。
        # bash 解析变量名时会把多字节首字节吞进名字，set -u 下直接
        # 报 "VER?: unbound variable"（早期版本就踩了这个坑）。
        # 因此下面一律写成 ${VAR} 显式定界，且用 printf 拼 JSON。
        run: |
          set -euo pipefail
          # 复用上一步「打壳」的产出（已含 data-shell=ios + __PLATFORM__）
          python3 scripts/pack.py
          SRC=Resources/app.html
          [ -f "${SRC}" ] || { echo "::error::${SRC} missing"; exit 1; }
          cp "${SRC}" kernel/dist.html
          BYTES=$(stat -f%z kernel/dist.html)
          SHA=$(shasum -a 256 kernel/dist.html | awk '{print $1}')
          VER=${SHA:0:12}
          NOW=$(date -u '+%Y-%m-%dT%H:%M:%SZ')

          printf '{\n  "version": "%s",\n  "file": "dist.html",\n  "bytes": %s,\n  "sha256": "%s",\n  "updated": "%s"\n}\n' \
            "${VER}" "${BYTES}" "${SHA}" "${NOW}" > kernel/kernel.json

          echo "kernel.json -> v${VER} (${BYTES} bytes, kernel/dist.html)"
          cat kernel/kernel.json

          git config user.name "dwg-kernel-bot"
          git config user.email "dwg-kernel-bot@users.noreply.github.com"
          git add kernel/dist.html kernel/kernel.json
          if git diff --cached --quiet; then
            echo "kernel unchanged, skip commit"
          else
            # [skip ci] 至关重要：本文件的触发器是 push:main，若不加标记，
            # 这次「发布内核」的提交会再次触发本工作流 → 再发布 → 死循环。
            # 内核产物只在用户改内核的那一次构建里更新，正是一次性、非自反的。
            git commit -m "kernel hot-update v${VER} (${BYTES} bytes) ${NOW} [skip ci]"
            # ★ 推送凭据（deploy key → SSH / 回落 GITHUB_TOKEN → https）只影响「能不能推上去」，
            #   **不影响 CDN 多快可见**（反证见文件顶部注释）。别再把 deploy key 当成时效手段。
            git push
            echo "pushed kernel v${VER}"

            # ★★ 建 release：给每版内核留一个**不可变引用锚点**，便于回溯/按 tag 固定。
            #   注意：端上 KUP 已不再依赖 @latest —— 实测别名解析被顽固缓存（别名 7 天，
            #   比分支 12 小时**更差**），purge 打不动。release 退居版本记录与应急锚点。
            #   tag 用 GITHUB_RUN_NUMBER 递增（每次不同 → jsDelivr 对新 tag 立即回源），
            #   语义化三段式 v1.0.N 也满足 purge 对 semver 的要求。
            TAG="v1.0.${GITHUB_RUN_NUMBER}"
            gh release create "${TAG}" --target main \
              --title "kernel ${VER}" \
              --notes "内核热更新锚点。内容 sha256 前 12 位 = ${VER}，${BYTES} 字节。" \
              && echo "release ${TAG} created -> main" \
              || echo "release ${TAG} 已存在或创建失败（不阻断出包）"
          fi

          # ★★★ 发布「时效锚点」—— 端上 probeTideIos() 靠它把内核更新压到秒级。
          #   为什么必须放在**内核提交之后**再单独提交一次：
          #     锚点里要写的是「带着新内核的那个提交」的 sha，而 sha 只有提交完才知道
          #     （先有鸡先有蛋），所以只能两段。
          #   为什么锚点 URL 能秒到：文件名是 10 分钟窗口（kernel/win/202610070000.js），
          #     天生是 jsDelivr 没见过的全新 URL → 必然回源。端上拿到 sha 后把 kcheck 的
          #     base 换成 @<sha>/kernel/（同样是全新 URL）→ 立即拿到新内核。
          #   探不到锚点 → 端上回落 @main，只是慢，功能不受影响（宁可慢不能断）。
          #   ★ 刻意放在 if 之外：内核这轮没变也要刷新窗口链 —— 否则「内核是上周改的、
          #     锚点早被 prune 掉」→ 端上探不到 → 只能回落 @main 慢 12 小时。
          KERNEL_SHA=$(git rev-parse HEAD)
          python3 scripts/mktide.py --sha "${KERNEL_SHA}" --version "${VER}" --prune
          git add kernel/win
          if git diff --cached --quiet; then
            echo "锚点无变化（同窗口内重复构建，URL 相同、内容相同）"
          else
            git commit -m "tide: kernel anchor @$(echo ${KERNEL_SHA} | cut -c1-10) ${NOW} [skip ci]"
            git push
            echo "pushed tide anchor -> $(echo ${KERNEL_SHA} | cut -c1-10)"
          fi

      - name: 兜底刷新 jsDelivr（对分支无效 —— 已由时效锚点取代，纯保险）
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        run: |
          # ★★ 2026-10-06 实测：purge 对**分支引用无效**
          #   （官方原文 "Valid semver releases must be used for purge to work"）。
          #   这里打 @main 属安慰剂，保留只为"万一哪天策略变了"。
          #   ★ 真正让内核秒级生效的是上一步发布的**时效锚点**：
          #     端上探到 kernel/win/<窗口>.js 里的 sha → 用 @<sha>/kernel/ 拉内核。
          for f in kernel/kernel.json kernel/dist.html; do
            curl -sS --max-time 30 \
              "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@main/$f" -o /dev/null \
              && echo "purged @main: $f" || echo "purge skipped: $f"
          done
